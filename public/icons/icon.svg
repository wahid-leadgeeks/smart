<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#292524" stroke-width="4" />
  
  <!-- Geometric Executive Insignia: Hexagonal Target & Growth Pillars -->
  <g transform="translate(256, 256)">
    <!-- Outer Target Ring Segment -->
    <circle r="160" fill="none" stroke="#44403C" stroke-width="8" stroke-dasharray="24 16" />
    <circle r="120" fill="none" stroke="#78716C" stroke-width="4" />

    <!-- Center Geometric Monogram (LG IT Diamond & Arrows) -->
    <!-- Upward Growth Arrow (Amber Gold) -->
    <path d="M0 -100 L75 30 L30 30 L30 90 L-30 90 L-30 30 L-75 30 Z" fill="url(#gold)" filter="drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4))" />
    
    <!-- Central Strategic Core Dot -->
    <circle cx="0" cy="-10" r="16" fill="#FFFFFF" />
    
    <!-- Year Tag 2026 -->
    <text x="0" y="150" font-family="sans-serif" font-size="32" font-weight="bold" fill="#E7E5E4" text-anchor="middle" letter-spacing="6">2026</text>
  </g>
</svg>